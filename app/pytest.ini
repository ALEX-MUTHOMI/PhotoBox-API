[pytest]
DJANGO_SETTINGS_MODULE = app.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -v
markers =
    unit: Pure logic tests, no I/O
    integration: Tests that hit real external services
    e2e: Full photographer upload flow tests
    celery: Celery worker tests
    cloudflare: Cloudflare-specific tests
    cloudinary: Cloudinary-specific tests
    slow: Tests that take > 5 seconds