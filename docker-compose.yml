services:

  # ── Django Application ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      args:
        - DEV=true
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - dev-static-data:/vol/web
    command: [ "run.sh" ]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - photobox_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  db:
    image: postgres:13-alpine
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - photobox_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - photobox_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Celery Worker ───────────────────────────────────────────────────────────
  celery:
    build:
      context: .
      args:
        - DEV=true
    command: [ "celery", "-A", "app", "worker", "--loglevel=info", "--queues=image-processing,default", "--concurrency=2" ]
    volumes:
      - ./app:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - photobox_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "celery -A app inspect ping -d celery@$$HOSTNAME || exit 1" ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  # ── Celery Beat ─────────────────────────────────────────────────────────────
  celery-beat:
    build:
      context: .
      args:
        - DEV=true
    command: [ "celery", "-A", "app", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler" ]
    volumes:
      - ./app:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery:
        condition: service_healthy
    networks:
      - photobox_network
    restart: unless-stopped

  # ── Test Runner ─────────────────────────────────────────────────────────────
  # Usage:
  #   docker compose run --rm test unit
  #   docker compose run --rm test api
  #   docker compose run --rm test celery
  #   docker compose run --rm test e2e
  #   docker compose run --rm test coverage
  #   docker compose run --rm test all
  test:
    build:
      context: .
      args:
        - DEV=true
    entrypoint: [ "run-tests.sh" ]
    command: [ "unit" ]
    volumes:
      - ./app:/app
    env_file:
      - .env
    environment:
      - STAGING_BASE_URL=http://app:8000
      - CELERY_TASK_ALWAYS_EAGER=True
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - photobox_network
    profiles:
      - test

networks:
  photobox_network:
    driver: bridge

volumes:
  dev-db-data:
  dev-static-data:
  redis-data:
