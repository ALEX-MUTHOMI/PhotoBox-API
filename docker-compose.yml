x-app-environment: &app-environment
  DB_HOST: db
  DB_NAME: devdb
  DB_USER: devuser
  DB_PASS: changeme
  DEBUG: "1"
  TESTING: "1"
  SECRET_KEY: your-secret-key-here
  JWT_SIGNING_KEY: test-signing-key-that-is-at-least-32-bytes-long!!
  PYTHONPATH: /app
  PYTHONDONTWRITEBYTECODE: "1"
  REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  CLOUDFLARE_R2_ENDPOINT: https://placeholder.r2.cloudflarestorage.com
  CLOUDFLARE_R2_BUCKET_NAME: test-bucket
  CLOUDFLARE_ACCESS_KEY_ID: test-access-key
  CLOUDFLARE_SECRET_ACCESS_KEY: test-secret-key
  CLOUDFLARE_R2_DOMAIN: placeholder.r2.cloudflarestorage.com
  CLOUDFLARE_WEBHOOK_SECRET: test-webhook-secret
  CLOUDINARY_CLOUD_NAME: photobox-app
  FRONTEND_URL: http://localhost:3000
  EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
  LEMON_SQUEEZY_API_KEY: test-key
  LEMON_SQUEEZY_STORE_ID: "1"
  LEMON_SQUEEZY_WEBHOOK_SECRET_PRIMARY: test-ls-secret
  LEMON_SQUEEZY_WEBHOOK_SECRET_SECONDARY: ""

x-app-build: &app-build
  context: .
  args:
    DEV: "true"
    APP_UID: ${APP_UID:-1000}
    APP_GID: ${APP_GID:-1000}

x-repo-mounts: &repo-mounts
  - ./:/repo-root:ro
  - ./app:/app
  - ./tests:/repo-tests:ro
  - ./pyproject.toml:/repo-config/pyproject.toml:ro
  - ./docker-compose.yml:/repo-root/docker-compose.yml:ro
  - ./docker-compose-deploy.yml:/repo-root/docker-compose-deploy.yml:ro
  - ./proxy:/repo-root/proxy:ro
  - ./.github:/repo-root/.github:ro
  - ./scripts:/scripts:ro
  - dev-static-data:/vol/web

services:
  db:
    image: postgres:16-alpine
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: devdb
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: changeme
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d devdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build: *app-build
    image: photobox-api-app:dev
    working_dir: /app
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "${APP_PORT:-8001}:8000"
    volumes: *repo-mounts
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      <<: *app-environment
      TESTING: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health-check/', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1024m

  # DAST overlay: DEBUG=False without SSL redirect; raised anon throttles for scanners.
  app-dast:
    profiles: ["zap", "newman", "dast"]
    image: photobox-api-app:dev
    working_dir: /app
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes: *repo-mounts
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      <<: *app-environment
      TESTING: "0"
      DEBUG: "0"
      PHOTBOX_DAST: "1"
      ALLOWED_HOSTS: "app,app-dast,localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      CSRF_TRUSTED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      TURNSTILE_SECRET_KEY: "dast-turnstile-stub-not-for-production"
      FRONTEND_URL: "http://localhost:3000"
    networks:
      default:
        aliases:
          - app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health-check/', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1024m

  celery:
    build: *app-build
    image: photobox-api-app:dev
    working_dir: /app
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes: *repo-mounts
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             celery -A app worker --loglevel=info --concurrency=1"
    environment:
      <<: *app-environment
      TESTING: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q OK"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    mem_limit: 1024m

  test:
    profiles: ["test"]
    build: *app-build
    image: photobox-api-app:dev
    working_dir: /app
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes: *repo-mounts
    # Invoke via sh so CI works when the bind-mounted script lacks +x
    # (common on Windows checkouts / Git without core.fileMode).
    entrypoint: ["/bin/sh", "/scripts/run-tests.sh"]
    command: ["unit"]
    environment:
      <<: *app-environment
      PYTEST_ADDOPTS: --tb=short -v
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      PHOTOBOX_REPO_ROOT: /repo-root
      PHOTOBOX_SCRIPTS_ROOT: /scripts
      PHOTOBOX_APP_ROOT: /app
      # Writable for non-root django-user (container /tmp is not always usable).
      COVERAGE_FILE: /home/django-user/.coverage
      TMPDIR: /home/django-user
      HOME: /home/django-user
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1024m

  # OWASP ZAP — passive Automation Framework scan (profile: zap)
  zap:
    profiles: ["zap"]
    image: ghcr.io/zaproxy/zaproxy:stable
    user: zap
    working_dir: /zap/wrk
    volumes:
      - ./artifacts/zap:/zap/wrk
    command:
      [
        "zap.sh",
        "-cmd",
        "-autorun",
        "/zap/wrk/automation.yaml",
      ]
    depends_on:
      app-dast:
        condition: service_healthy
    mem_limit: 2048m

  newman:
    profiles: ["newman"]
    image: postman/newman:alpine
    volumes:
      - ./postman:/etc/newman:ro
    working_dir: /etc/newman
    depends_on:
      app-dast:
        condition: service_healthy
    mem_limit: 512m

volumes:
  dev-db-data:
  dev-static-data:
  redis-data:
