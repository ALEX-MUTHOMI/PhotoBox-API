name: Checks

on:
  push:
    branches: [ "main", "staging", "development" ]
  pull_request:
    branches: [ "main", "staging" ]

jobs:
  test-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Spin up Docker Stack
        # 'up -d' ensures app, db, redis, and celery ALL start together
        run: docker compose up -d --build
        
      - name: Wait for Database
        # The -T flag prevents "the input device is not a TTY" errors in CI
        run: docker compose exec -T app python manage.py wait_for_db

      - name: Run Security & Regression Suite
        run: docker compose exec -T -e SAFE_TEST_ENV=1 app python manage.py test --verbosity=2

      - name: Run Linter
        run: docker compose exec -T app flake8

      - name: Tear Down Stack
        if: always()
        # Bash check: Only run docker compose down IF the file was actually checked out
        run: |
          if [ -f "docker-compose.yml" ]; then
            docker compose down -v
          else
            echo "Skipping teardown: docker-compose.yml not found."
          fi