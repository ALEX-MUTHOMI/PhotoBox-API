    needs: [unit, celery]
    steps:
      - uses: actions/checkout@v4
      - name: Register secret masks
        env:
          SECRET_KEY_MASK: ${{ secrets.SECRET_KEY }}
          DB_PASS_MASK: ${{ secrets.DB_PASS }}
          CLOUDFLARE_ACCESS_KEY_ID_MASK: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_SECRET_ACCESS_KEY_MASK: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_WEBHOOK_SECRET_MASK: ${{ secrets.CLOUDFLARE_WEBHOOK_SECRET }}
