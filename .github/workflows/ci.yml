            "$TURNSTILE_SECRET_KEY_MASK" \
            "$IP_HASH_SALT_MASK"; do
            if [ -n "$secret_value" ]; then
              echo "::add-mask::$secret_value"
            fi
          done
      - name: Generate CI env
        run: bash .github/workflows/ci_env.sh
      - name: Unit tests
