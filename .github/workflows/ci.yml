            "$CLOUDFLARE_ACCESS_KEY_ID_MASK" \
            "$CLOUDFLARE_SECRET_ACCESS_KEY_MASK" \
            "$CLOUDFLARE_WEBHOOK_SECRET_MASK" \
            "$LEMON_SQUEEZY_API_KEY_MASK" \
            "$LEMON_SQUEEZY_WEBHOOK_SECRET_PRIMARY_MASK" \
