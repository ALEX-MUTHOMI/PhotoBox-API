  /api/v1/ingestion/bulk/:
    post:
      operationId: v1_ingestion_bulk_create
      description: |-
        Heavy Lane Bulk Ingestion Gateway.

        Lock contention architecture:
            Phase 1 — CPU-bound, NO lock:
                Validate scene ownership, generate UUIDs,
                validate R2 keys, generate presigned POST URLs.
                Duration: O(N × HMAC_cost). Lock held: zero.

            Phase 2 — DB-only, lock held O(1):
                Re-validate scene (race guard), quota check,
                quota deduction, bulk_create.
                Duration: ~7-17ms regardless of batch size.

        If Phase 2 rejects (quota exceeded, scene deleted, lock contention),
        the Phase 1 presigned URLs are orphaned. This is safe: no MediaAsset
        records exist, so any upload against those URLs hits the ghost key
        handler in R2WebhookView and is silently ignored. URLs expire after
        _UPLOAD_TICKET_TTL seconds.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/ingestion/webhook/:
    post:
      operationId: v1_ingestion_webhook_create
      description: |-
        Cloudflare R2 Upload Completion Webhook Receiver.

        Security layers applied in strict order:
          1.  Content-Length soft guard (hard limit must be in nginx)
          2.  Raw body capture before DRF stream consumption
          3.  Signature header presence check
          4.  Secret misconfiguration guard (fail closed → 500, not 403)
          5.  HMAC-SHA256 constant-time verification
          6.  Replay attack window (timestamp-based, optional header)
          7.  JSON parse with explicit error handling
          8.  Action filter (PutObject only, 200 on others)
          9.  r2_object_key presence check
          10. Ghost key tolerance (200 on unknown keys)
          11. Atomic: select_for_update + idempotency + size check + transition
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/webhooks/cloudflare/r2/:
    post:
      operationId: v1_webhooks_cloudflare_r2_create
      description: |-
        Ingests Cloudflare R2 webhooks.
        Validates HMAC signature and updates MediaAsset state asynchronously.
      tags:
      - v1
      responses:
        '200':
          description: No response body
components:
  schemas:
    Event:
      type: object
      description: Serializer for managing the primary Event (e.g., The Wedding).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        event_date:
          type: string
          format: date
          nullable: true
        cover_image_url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        is_published:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        client_email:
          type: string
          format: email
          nullable: true
          description: Client's email address. Gallery-ready notification is sent
            here on publish.
          maxLength: 254
        client_name:
          type: string
          nullable: true
          description: Client's display name used in the notification email.
          maxLength: 255
      required:
      - created_at
      - id
      - slug
      - title
    EventRequest:
      type: object
      description: Serializer for managing the primary Event (e.g., The Wedding).
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        event_date:
          type: string
          format: date
          nullable: true
        cover_image_url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        is_published:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
        gallery_pin:
          type: string
          writeOnly: true
        client_email:
          type: string
          format: email
          nullable: true
          description: Client's email address. Gallery-ready notification is sent
            here on publish.
          maxLength: 254
        client_name:
          type: string
          nullable: true
          description: Client's display name used in the notification email.
          maxLength: 255
      required:
      - title
    EventTypeEnum:
      enum:
      - WEDDING
      - CORPORATE
      - GOVERNMENT
      - NGO
      - PRIVATE
      - SPORTS
      - STUDIO
      - COMMERCIAL
      - OTHER
      type: string
