    PhotoFastLane:
      type: object
      description: |-
        Serializer for the Fast Lane and client delivery.

        Delivery fields (read-only, computed from model properties):
          - delivery_url:  Cloudinary Fetch proxy URL (WebP, auto quality)
          - download_url:  R2 presigned GET URL (hard 900s expiry)
          - aspect_ratio:  width/height for zero-layout-shift masonry grids

        DO NOT use this for 5,000 Wedding RAWs. Use the Ingestion App (Heavy Lane) for that.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        scene:
          type: string
          format: uuid
        image_file:
          type: string
          format: uri
        original_filename:
          type: string
          readOnly: true
        file_size_bytes:
          type: integer
          readOnly: true
        is_processed:
          type: boolean
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        blurhash:
          type: string
          readOnly: true
          nullable: true
          description: Base64 LQIP string
        delivery_url:
          type: string
          readOnly: true
        download_url:
          type: string
          nullable: true
          readOnly: true
        aspect_ratio:
          type: number
          format: double
          nullable: true
          readOnly: true
        width:
          type: integer
          readOnly: true
          nullable: true
          description: Image pixel width. Set by Celery worker post-upload.
        height:
          type: integer
          readOnly: true
          nullable: true
          description: Image pixel height. Set by Celery worker post-upload.
        r2_download_url:
          type: string
          readOnly: true
        cloudinary_thumbnail_url:
          type: string
          readOnly: true
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - aspect_ratio
      - blurhash
      - cloudinary_thumbnail_url
      - delivery_url
      - download_url
      - file_size_bytes
      - height
      - id
      - image_file
      - is_processed
      - original_filename
      - r2_download_url
      - scene
      - status
      - uploaded_at
      - width
